logging.level.root=ERROR
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.cors.reactive.CorsWebFilter=DEBUG

app.gitlab.base-url=https://gitlab.example.test
app.gitlab.group-path=dummy
app.gitlab.reviewers-group=reviewers
app.gitlab.user-info-path=/oauth/userinfo

app.cors.allowed-origins=http://localhost:5173
http.client.timeout=5
management.server.port=0

# === Codec / Multipart memory limits ===
# Global max buffer for JSON body deserialization (lowered from 100 MB to prevent heap abuse)
spring.http.codecs.max-in-memory-size=${SPRING_HTTP_CODECS_MAX_IN_MEMORY_SIZE:256KB}
# Multipart: small parts buffered in memory, large parts spill to disk
spring.webflux.multipart.max-in-memory-size=${MULTIPART_MAX_IN_MEMORY_SIZE:10MB}
spring.webflux.multipart.max-disk-usage-per-part=${MULTIPART_MAX_DISK_PER_PART:100MB}
spring.webflux.multipart.file-storage-directory=${UPLOAD_TEMP_DIR:/tmp}

# === Validation ===
validation.commit.max.inmemory.max.size=${VALIDATION_COMMIT_INMEMORY_MAX_SIZE:256000}
validation.commit.content.max-length=${VALIDATION_COMMIT_CONTENT_MAX_SIZE:100000000}
validation.commit.content.temp-dir=${UPLOAD_TEMP_DIR:/tmp}

# === /actuator Basis ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus,sbom

management.endpoints.access.max-permitted=read-only
management.endpoints.access.default=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only
management.endpoint.health.access=read-only
management.endpoint.health.probes.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.sbom.access=read-only

management.info.env.enabled=true

management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.metrics.export.prometheus.enabled=true